
<!DOCTYPE html>
<html>
<head>
    <title>Teacher Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f4f9;
        }

        .sidebar {
            width: 230px;
            height: 100vh;
            background-color: #183b56;
            color: white;
            position: fixed;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #315b78;
        }

        .main {
            margin-left: 230px;
            padding: 25px;
        }

        .header {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #183b56;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-container h3 {
            color: #183b56;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .add-btn {
            margin-top: 20px;
            background-color: #183b56;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .table-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .table-container h3 {
            color: #183b56;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #183b56;
            color: white;
        }

        .delete-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        @media(max-width: 650px) {

            .sidebar {
                width: 150px;
                padding: 15px 8px;
            }

            .sidebar h2 {
                font-size: 16px;
            }

            .main {
                margin-left: 150px;
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Campus MS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="teachers.html" class="active">Teachers</a>
        <a href="departments.html">Departments</a>
        <a href="courses.html">Courses</a>
        <a href="attendance.html">Attendance</a>
        <a href="results.html">Results</a>

    </div>


    <!-- Main Content -->

    <div class="main">

        <div class="header">
            <h2>Teacher Management</h2>
        </div>


        <!-- Add Teacher Form -->

        <div class="form-container">

            <h3>Add New Teacher</h3>

            <form id="teacherForm">

                <div class="form-grid">

                    <div>
                        <label>Teacher ID</label>
                        <input type="text" id="teacherId"
                        placeholder="Enter Teacher ID" required>
                    </div>

                    <div>
                        <label>Teacher Name</label>
                        <input type="text" id="teacherName"
                        placeholder="Enter Teacher Name" required>
                    </div>

                    <div>
                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option>Computer Science</option>
                            <option>Information Technology</option>
                            <option>Software Engineering</option>
                            <option>Data Science</option>
                        </select>
                    </div>

                    <div>
                        <label>Specialization</label>
                        <input type="text" id="specialization"
                        placeholder="Enter Specialization" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email"
                        placeholder="Enter Email" required>
                    </div>

                    <div>
                        <label>Phone Number</label>
                        <input type="tel" id="phone"
                        placeholder="Enter Phone Number" required>
                    </div>

                </div>

                <button type="submit" class="add-btn">
                    Add Teacher
                </button>

            </form>

        </div>


        <!-- Teacher Records -->

        <div class="table-container">

            <h3>Teacher Records</h3>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Specialization</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="teacherTable">

                    <tr>
                        <td>T101</td>
                        <td>Dr. Ahmed Khan</td>
                        <td>Computer Science</td>
                        <td>Database Systems</td>
                        <td>ahmed@gmail.com</td>
                        <td>03001234567</td>
                        <td>
                            <button class="delete-btn"
                            onclick="this.closest('tr').remove()">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        document.getElementById("teacherForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let id = document.getElementById("teacherId").value;
            let name = document.getElementById("teacherName").value;
            let department = document.getElementById("department").value;
            let specialization = document.getElementById("specialization").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;

            let table = document.getElementById("teacherTable");

            let row = table.insertRow();

            row.innerHTML = `
                <td>${id}</td>
                <td>${name}</td>
                <td>${department}</td>
                <td>${specialization}</td>
                <td>${email}</td>
                <td>${phone}</td>
                <td>
                    <button class="delete-btn"
                    onclick="this.closest('tr').remove()">
                        Delete
                    </button>
                </td>
            `;

            document.getElementById("teacherForm").reset();

            alert("Teacher added successfully!");

        });

    </script>

</body>
</html>
